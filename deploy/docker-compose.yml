# Local demo topology: two containers on a private compose network, both ports
# published on 127.0.0.1 only so nothing is reachable from the venue network.
#
#   cp deploy/.env.example deploy/.env   # then fill in real secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
#
# Open http://127.0.0.1:8001 and sign in with DASHBOARD_TOKEN.
#
# This is a DEMO topology. It is not a production deployment: SQLite replaces
# PostgreSQL, a static token replaces an identity provider, and the dashboard
# talks to the API over plaintext on a private network.

x-image: &image
  image: fraud-platform:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  api:
    <<: [*image, *hardening]
    environment:
      PORT: "8000"
      DEMO_DB_PATH: /srv/data/fraud_demo.sqlite3
      DEMO_API_TOKEN: ${DEMO_API_TOKEN:?required - service credential for the scoring API}
      # mock = labeled synthetic fixtures, zero provider cost.
      # live = real paid Qwen calls; requires the three settings below.
      QWEN_MODE: ${QWEN_MODE:-mock}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      QWEN_MODEL: ${QWEN_MODEL:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    volumes:
      - demo-data:/srv/data
    ports:
      # Host ports are configurable for machines where 8000/8001 are taken;
      # container ports stay fixed and FRAUD_API_BASE_URL is internal-only.
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  dashboard:
    <<: [*image, *hardening]
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: "8001"
      # Private compose hostname. The BFF rejects plaintext non-loopback URLs by
      # default, so this opt-in is required here. In production leave it unset
      # and use an https:// base URL with TLS or mesh mTLS.
      FRAUD_API_BASE_URL: http://api:8000
      FRAUD_API_ALLOW_PRIVATE_HTTP: "1"
      DEMO_API_TOKEN: ${DEMO_API_TOKEN:?required - BFF calls the scoring API}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:?required - browser sign-in credential}
      # Set to 1 when the dashboard is served over HTTPS.
      DASHBOARD_SECURE_COOKIES: ${DASHBOARD_SECURE_COOKIES:-0}
    command: ["python", "-m", "uvicorn", "dashboard:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    ports:
      - "127.0.0.1:${DASH_HOST_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  demo-data:
