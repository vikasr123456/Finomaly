# EXAMPLE TLS termination for the analyst dashboard — not applied or tested here.
#
# Purpose: production requires HTTPS in front of the dashboard so the session
# cookie can be marked Secure (DASHBOARD_SECURE_COOKIES=1), and requires the
# scoring API to be reachable only privately. In that configuration
# FRAUD_API_ALLOW_PRIVATE_HTTP stays 0 and FRAUD_API_BASE_URL is https://.
#
# You must supply certificates from your own CA/ACM process. Do not expose the
# scoring API publicly: it is a service-to-service endpoint authenticated by a
# shared X-API-Key, and should sit on a private network or behind mTLS.
#
# Validate before use:  nginx -t -c /path/to/this/file

upstream dashboard_bff {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name fraud-console.internal.example;
    # Redirect only; never serve the console over plaintext.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fraud-console.internal.example;

    ssl_certificate     /etc/ssl/private/fraud-console.crt;      # replace
    ssl_certificate_key /etc/ssl/private/fraud-console.key;      # replace
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The BFF already sets a strict CSP, X-Frame-Options, and nosniff on every
    # response. Do not duplicate or weaken them here.

    client_max_body_size 64k;   # transaction payloads are small; reject the rest

    location / {
        proxy_pass http://dashboard_bff;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";
        # Cookies carry the session; never rewrite or strip them.
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Interactive API docs are a local debugging tool, not an analyst surface.
    location ~ ^/(docs|redoc|openapi.json) { return 404; }
}
